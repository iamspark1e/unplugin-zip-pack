name: Vite and Node Compatibility

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vite-compat:
    name: Vite ${{ matrix.vite }} / Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - vite: '~4.2.0'
            node: '20'
          - vite: '~4.3.0'
            node: '20'
          - vite: '~4.4.0'
            node: '20'
          - vite: '~4.5.0'
            node: '20'
          - vite: '^5.0.0'
            node: '20'
          - vite: '^6.0.0'
            node: '20'
          - vite: '^7.0.0'
            node: '22'
          - vite: 'latest'
            node: '20'
          - vite: 'latest'
            node: '22'
          - vite: 'latest'
            node: '24'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # Node 20/22 ship npm 10.x, whose arborist crashes with
      # "Cannot read properties of null (reading 'edgesOut')" while resolving
      # the peer sets of recent Vite releases. npm 11+ contains the fix.
      - name: Upgrade npm
        run: npm install --global npm@11.6.0

      - name: Install locked dependencies
        run: npm ci

      - name: Build package
        run: npm run build

      - name: Install Vite compatibility target
        run: npm install --prefix .vite-compat --no-save --package-lock=false --ignore-scripts --no-audit --no-fund "vite@${{ matrix.vite }}"

      - name: Test Vite integration
        run: VITE_BIN=.vite-compat/node_modules/vite/bin/vite.js node scripts/test-vite-compat.mjs
